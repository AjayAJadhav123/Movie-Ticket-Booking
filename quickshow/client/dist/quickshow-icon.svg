<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" width="48" height="48">
  <defs>
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D946EF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#D946EF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E11D48;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Film reel circle background -->
  <circle cx="24" cy="24" r="20" fill="none" stroke="url(#iconGradient)" stroke-width="2.5" opacity="0.2"/>
  
  <!-- Main circle with gradient -->
  <circle cx="24" cy="24" r="16" fill="url(#iconGradient)" opacity="0.95"/>
  
  <!-- Play triangle -->
  <polygon points="18,16 18,32 34,24" fill="white" opacity="0.95"/>
  
  <!-- Film strip edge accents -->
  <rect x="6" y="20" width="2.5" height="4" fill="url(#accentGradient)" opacity="0.85"/>
  <rect x="6" y="28" width="2.5" height="4" fill="url(#accentGradient)" opacity="0.85"/>
  <rect x="39.5" y="20" width="2.5" height="4" fill="url(#accentGradient)" opacity="0.85"/>
  <rect x="39.5" y="28" width="2.5" height="4" fill="url(#accentGradient)" opacity="0.85"/>
</svg>
